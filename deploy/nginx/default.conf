# Reverse proxy in front of several application instances. Nothing here is specific to the
# two containers of the example: the application keeps no state in memory, so adding a third
# instance is one more `server` line.

# Round robin, nginx's default. `least_conn` is the better choice once request durations vary
# widely, but it sends a sequence of one-at-a-time requests to the same instance, which makes
# the spread invisible when you check it with a loop.
upstream api {
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# The same instances, but always the same one for a given client. Socket.IO opens its session
# with an HTTP handshake and then upgrades: a second request routed elsewhere would be met with
# "Session ID unknown". The Redis adapter shares the *messages* between instances, not the
# handshake, so this is still needed.
upstream api_sticky {
    ip_hash;
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # The application enforces its own limit; this one only protects nginx itself.
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Appended, not replaced: the rate limiter and the login throttle count per client address,
    # and they would all count as one if every request arrived as the proxy's own IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /realtime {
        proxy_pass http://api_sticky;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A websocket is long-lived; the default read timeout would cut it every minute.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://api;
        # Empties the Connection header so the keepalive pool above is actually used.
        proxy_set_header Connection "";
        # Names the instance that answered. Useful to see the load spread, and to remove once
        # the topology is no longer something you want to advertise.
        add_header X-Upstream $upstream_addr always;
    }
}
