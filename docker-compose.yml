# Development dependencies. No MongoDB: this project is PostgreSQL only.
#
# Host ports are shifted off the defaults so this stack can run next to the other OrangCode
# projects on the same machine. Inside the compose network the services still use their
# standard ports, so only the left-hand side of each mapping is unusual.
name: fintech-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech
    ports:
      - '5434:5432'
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql: it stores PGDATA in a
      # major-version subdirectory so `pg_upgrade --link` can work across the same mount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fintech -d fintech']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6383:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. The application talks plain S3, so moving to AWS,
  # Scaleway or any other provider is a change of endpoint and credentials.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: fintech
      MINIO_ROOT_PASSWORD: fintech-secret
    ports:
      - '9030:9000'
      - '9031:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once and exits. Keeps bucket provisioning out of the application,
  # where it would run on every boot of every instance.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fintech fintech-secret &&
      mc mb --ignore-existing local/fintech-media &&
      echo 'bucket ready'"

  # Catches every outgoing email in development: no security notice can reach a real inbox
  # by accident. SMTP on 1028, web interface on http://localhost:8028.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1028:1025'
      - '8028:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
