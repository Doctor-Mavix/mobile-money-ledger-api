# Lint, types and tests on every push and every pull request.
#
# The test suite is not hermetic on purpose: the integration project runs against a real
# Postgres, and the media tests write real objects to an S3 endpoint. Mocking any of that
# would only prove the mocks agree with themselves.
name: CI

on:
  push:
    branches: [main, orangcode_develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--ignore-scripts` would skip the postinstall that generates the Prisma client, so the
      # dependency scripts run — the lockfile is frozen, which is what pins what may execute.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # The dev stack itself, rather than `services:` here: running the same file the
      # developers run means CI cannot drift from a working local setup.
      - name: Start the dependencies
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose up minio-init

      - run: pnpm db:deploy

      - run: pnpm test

      - name: Dependency logs
        if: failure()
        run: docker compose logs --no-color --tail 100

    env:
      # Matches docker-compose.yml. tests/setup.ts fills in everything else the application
      # validates at boot, so no secret is needed to run this workflow.
      DATABASE_URL: postgresql://fintech:fintech@127.0.0.1:5434/fintech
      TEST_POSTGRES_URL: postgresql://fintech:fintech@127.0.0.1:5434/fintech
      REDIS_URL: redis://127.0.0.1:6383

  # A broken Dockerfile is only discovered at deploy time otherwise. Built, not pushed:
  # publishing belongs to a release workflow, which depends on where the project is deployed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
